<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Satellite Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Signal Pulse Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container with Glass Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="12"/>

  <!-- Signal Radar Waves -->
  <circle cx="340" cy="172" r="110" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="340" cy="172" r="75" fill="none" stroke="#38bdf8" stroke-width="16" opacity="0.7" filter="url(#glow)"/>
  <circle cx="340" cy="172" r="40" fill="none" stroke="#60a5fa" stroke-width="18" filter="url(#glow)"/>

  <!-- Satellite Body & Antenna Design -->
  <g transform="translate(40, 40)">
    <!-- Base Dish -->
    <path d="M 120 280 C 120 180, 220 80, 320 80 C 330 110, 290 190, 220 260 C 190 290, 140 300, 120 280 Z" fill="url(#metalGrad)"/>
    <path d="M 140 260 C 160 190, 240 120, 300 100" fill="none" stroke="#0284c7" stroke-width="8" opacity="0.5"/>
    
    <!-- Dish Stand / Pivot -->
    <path d="M 170 270 L 110 350 M 210 230 L 150 370" stroke="#94a3b8" stroke-width="20" stroke-linecap="round"/>
    <circle cx="130" cy="360" r="18" fill="#38bdf8"/>

    <!-- Beam Emitter -->
    <line x1="230" y1="180" x2="310" y2="100" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="310" cy="100" r="14" fill="#fbbf24" filter="url(#glow)"/>
  </g>
</svg>
